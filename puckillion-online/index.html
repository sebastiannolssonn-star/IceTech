<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PUCKILLION — Online hockey trivia</title><style>
:root{color-scheme:dark;--ink:#edfaff;--muted:#a1b9cc;--ice:#80e5fc;--bg:#071422;--card:#10263a;--line:#25445d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#15374b 0,#071422 56%);color:var(--ink);font:16px system-ui,sans-serif;min-height:100vh}main{max-width:640px;padding:24px 16px 40px;margin:auto}header{text-align:center;padding:15px 0 25px}.logo{font-size:clamp(38px,9vw,67px);font-weight:1000;letter-spacing:-3px;font-style:italic;line-height:1}.ice{color:var(--ice)}.eyebrow{font-size:11px;letter-spacing:2.4px;color:var(--ice);font-weight:800;text-transform:uppercase}.sub{font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:12px}.panel{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:22px;margin:12px 0;box-shadow:0 12px 40px #0002}h1,h2{line-height:1.18;margin:10px 0 15px;overflow-wrap:anywhere}h1{font-size:28px}h2{font-size:23px}p{color:var(--muted);line-height:1.55;font-size:14px}label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:16px 0 6px}input,select,button{font:inherit;border-radius:10px;padding:14px;width:100%;min-height:48px}input,select{border:1px solid #416079;background:var(--bg);color:var(--ink)}button{border:0;background:var(--ice);color:var(--bg);font-weight:850;cursor:pointer;margin-top:12px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#1c3b52;color:var(--ink);border:1px solid #42647a}.scores,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{background:#10263a;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.score.me{border-color:var(--ice)}.score strong{display:block;font-size:32px;font-variant-numeric:tabular-nums}.name{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.timer{font-size:54px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.15}.track{height:8px;border-radius:9px;background:#294458;overflow:hidden;margin:10px 0 20px}.bar{height:100%;background:var(--ice)}.center{text-align:center}.code{font-size:40px;letter-spacing:6px;font-weight:900;color:var(--ice)}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.row:last-child{border-bottom:0}.tier{font-size:11px;color:#a4bbcc;letter-spacing:1px}.pts{white-space:nowrap;font-weight:900;color:var(--ice)}.gold{color:#ffd47b}.error{color:#ff9a9a;font-size:13px;min-height:18px}.hidden{display:none}details{margin-top:18px;color:var(--muted)}summary{cursor:pointer}footer{font-size:11px;text-align:center;color:#8199ad;margin-top:25px}a{color:var(--ice)}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:11px;color:var(--muted);margin-top:5px}</style></head><body><main><header><div class="logo">PUCK<span class="ice">ILLION</span></div><div class="sub">ALL-ERA NHL · LIVE 1V1</div></header><div id="app"></div><div id="error" class="error" role="alert"></div><footer>Independent hockey trivia · Not affiliated with the NHL<br>Rarity is estimated from season performance, not measured answer popularity.</footer></main><script>
const app=document.querySelector('#app'),err=document.querySelector('#error');let auth=null,s=null,renderKey='',busy=false,offset=0;const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const invite=params.get('room')||'';
try{auth=JSON.parse(sessionStorage.getItem('puck-auth')||'null')}catch{}if(invite&&auth?.code!==invite)auth=null;
function setAuth(a){auth=a;try{sessionStorage.setItem('puck-auth',JSON.stringify(a))}catch{}}
async function api(action,data={},method='POST'){const b={...auth,...data};const opt=method==='GET'?{}:{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)};const res=await fetch('/api/'+action+(method==='GET'?'?'+new URLSearchParams(b):''),opt);const x=await res.json();if(!res.ok)throw Error(x.error||'Request failed');return x}
function update(x){s=x;offset=x.serverNow-Date.now();const key=JSON.stringify([s.phase,s.round,s.loaded,s.error,s.players]);if(key!==renderKey){renderKey=key;render()}clock()}
function error(msg){err.textContent=msg||''}
async function act(action,data={}){if(busy)return;busy=true;error('');try{const x=await api(action,data);if(x.token){setAuth({code:x.state.code,token:x.token});update(x.state)}else update(x)}catch(ex){error(ex.message)}finally{busy=false}}
function home(){app.innerHTML=`<section class="panel"><div class="eyebrow">Private online match</div><h1>The deepest cut wins.</h1><p>Find the most obscure correct NHL player. Both players answer the same question at the same time.</p><label>Your name</label><input id="name" maxlength="28" placeholder="Your name"><div class="grid"><div><label>Rounds</label><select id="count"><option>7</option><option>10</option><option>15</option></select></div><div><label>Seconds per round</label><select id="seconds"><option>25</option><option>15</option><option>40</option></select></div></div><label>Era</label><select id="era"><option value="all">All NHL history · 1917 onward</option><option value="modern">Modern · 2000 onward</option><option value="classic">Classic · 1917–1999</option></select><button id="create">CREATE PRIVATE ROOM</button></section><section class="panel"><div class="eyebrow">Join your friend</div><label>Room code</label><input id="joincode" value="${e(invite)}" placeholder="6-character code" maxlength="6" autocapitalize="characters"><button class="secondary" id="join">JOIN MATCH</button></section>`;$('create').onclick=()=>act('create',{name:$('name').value,count:+$('count').value,seconds:+$('seconds').value,era:$('era').value});$('join').onclick=()=>act('join',{name:$('name').value,code:$('joincode').value.toUpperCase().trim()})}
function scoreboard(){return `<div class="scores">${s.players.map(p=>`<div class="score ${p.id===s.me?'me':''}"><div class="name">${e(p.name)} ${p.id===s.me?'· YOU':''}</div><strong>${p.score}</strong><div class="tier">${p.locked?'ANSWER LOCKED':'POINTS'}</div></div>`).join('')}</div>`}
function render(){const old=$('guess')?.value||'',focused=document.activeElement===$('guess');if(!s){home();return}const me=s.players.find(p=>p.id===s.me);const head=scoreboard();if(s.phase==='lobby'){app.innerHTML=head+`<section class="panel center"><div class="eyebrow">Private lobby · ${s.count} rounds</div><h2>Invite your friend</h2><div class="code">${e(s.code)}</div><p>${s.players.length===2?'Both players connected.':'Waiting for your opponent…'}</p><button id="share" class="secondary">COPY INVITE LINK</button>${s.host?`<button id="start" ${s.players.length!==2?'disabled':''}>DROP THE PUCK</button>`:'<p>Waiting for host to start.</p>'}<p class="error">${e(s.error)}</p></section>`;$('share').onclick=async()=>{const link=new URL(location.pathname,location.origin);link.searchParams.set('room',s.code);try{await navigator.clipboard.writeText(link.href);error('Invite copied!')}catch{prompt('Copy invite link:',link.href)}};if($('start'))$('start').onclick=()=>act('start')}
else if(s.phase==='loading'){app.innerHTML=head+`<section class="panel center"><div class="eyebrow">Building historical match</div><h2>Loading NHL records</h2><div class="code">${s.loaded}/${s.count}</div><p>Fetching and validating season statistics for this match.</p></section>`}
else if(s.phase==='playing'){app.innerHTML=head+`<section class="panel"><div class="eyebrow">Round ${s.round} / ${s.count} · ${e(s.question.tag)}</div><div class="timer" id="timer"></div><div class="track"><div class="bar" id="bar"></div></div><h2>${e(s.question.text)}</h2>${me.locked?'<p class="center ice">Answer locked. Waiting for reveal…</p>':`<form id="form"><label>One answer. Make it count.</label><input id="guess" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="100" placeholder="Player name" value="${e(old)}"><button>LOCK ANSWER</button></form><button id="skip" class="secondary">PASS</button>`}</section>`;if($('form')){$('form').onsubmit=ev=>{ev.preventDefault();const v=$('guess').value.trim();if(v)act('answer',{answer:v,round:s.round})};$('skip').onclick=()=>act('answer',{answer:'',round:s.round});if(focused)$('guess').focus()}}
else if(s.phase==='reveal'){const q=s.question;app.innerHTML=head+`<section class="panel"><div class="eyebrow">Round ${s.round} results · ${q.answerCount} accepted answers</div><h2>${e(q.text)}</h2>${s.players.map(p=>`<div class="row"><div><div class="name">${e(p.name)}</div><strong>${e(p.answer?.answer?.name||p.answer?.input||'No answer')}</strong><div class="tier">${e(p.answer?.answer?.tier||'No points')}</div></div><span class="pts">+${p.answer?.answer?.points||0}</span></div>`).join('')}<details><summary>Explore all accepted answers</summary>${[...q.answers].sort((a,b)=>b.points-a.points).map(a=>`<div class="row"><span>${e(a.name)}</span><span class="pts">${a.points}</span></div>`).join('')}</details>${s.host?`<button id="next">${s.round===s.count?'FINAL SCORE':'NEXT ROUND →'}</button>`:'<p>Waiting for host to continue.</p>'}</section>`;if($('next'))$('next').onclick=()=>act('next')}
else if(s.phase==='finished'){const [a,b]=s.players;const winner=a.score===b.score?'It’s a tie!':`${e(a.score>b.score?a.name:b.name)} wins the Cup!`;app.innerHTML=head+`<section class="panel center"><div class="eyebrow">Full time</div><div style="font-size:55px">🏆</div><h1 class="gold">${winner}</h1><p>${s.count} rounds · ${e(s.code)}</p>${s.host?'<button id="rematch">REMATCH — NEW QUESTIONS</button>':'<p>Waiting for host to start a rematch.</p>'}</section>`;if($('rematch'))$('rematch').onclick=()=>act('rematch')}
app.insertAdjacentHTML('beforeend','<button class="secondary" id="leave">LEAVE ROOM</button>');$('leave').onclick=()=>{setAuth(null);s=null;renderKey='';history.replaceState(null,'',location.pathname);home();error('')};}
function clock(){if(!s||s.phase!=='playing'||!$('timer'))return;const t=Math.max(0,(s.deadline-Date.now()-offset)/1000);$('timer').textContent=Math.ceil(t);$('bar').style.width=Math.min(100,t/s.seconds*100)+'%';$('bar').style.background=t<=5?'#ff8b8b':'var(--ice)'}
let polling=false;async function poll(){if(!auth||busy||polling)return;polling=true;const old=auth;try{const x=await api('state',{},'GET');if(auth===old&&!busy)update(x)}catch(ex){if(auth===old){if(/not found|expired|Invalid player/.test(ex.message)){setAuth(null);s=null;home()}error(ex.message)}}finally{polling=false}}
home();poll();setInterval(poll,650);setInterval(clock,100);
</script></body></html>
